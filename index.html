<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextCraft Pro v6 - Glass & Shine FX</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="top-nav">
            <div class="logo">
                <span class="logo-icon">🔮</span>
                <span class="logo-text">TextCraft <span>Pro v6</span></span>
            </div>

            <div class="center-tools">
                <button id="add-text-btn" class="tool-btn">+ Add Text</button>
                <label for="font-upload" class="tool-btn file-label">📁 Upload Font</label>
                <input type="file" id="font-upload" accept=".ttf, .otf, .woff, .woff2" style="display:none;">
                <button id="play-motion-btn" class="tool-btn action-btn">▶ Play Motion</button>
                <button id="reset-project-btn" class="tool-btn danger-btn" title="ক্যানভাস খালি করুন">🗑 Clear</button>
            </div>

            <div class="right-actions">
                <select id="canvas-ratio" class="nav-select">
                    <option value="ratio-1080">1080 x 1080 (Square)</option>
                    <option value="ratio-16-9">1920 x 1080 (Landscape)</option>
                    <option value="ratio-9-16">1080 x 1920 (Reels/Shorts)</option>
                </select>
                <button id="export-png-btn" class="tool-btn">📸 PNG</button>
                <button id="export-webm-btn" class="export-btn">🎬 Export Motion (.webm)</button>
            </div>
        </header>

        <div class="main-body">
            <aside class="sidebar left-sidebar">
                <div class="section-title">LAYERS</div>
                <div id="layer-list" class="layer-container"></div>

                <div class="section-title" style="margin-top: 20px;">PREMIUM STYLE PRESETS</div>
                <div class="preset-grid">
                    <button class="preset-card p-glass" data-preset="glass-frost">🧊 গ্লাস ফ্রস্ট</button>
                    <button class="preset-card p-cyan-glow" data-preset="cyan-glass">💎 গ্লাসি সায়ান</button>
                    <button class="preset-card p-shine-gold" data-preset="gold-shine">✨ শাইনিং গোল্ড</button>
                    <button class="preset-card p-neon-fire" data-preset="neon-fire">🔥 নিয়ন ফায়ার</button>
                    <button class="preset-card p-3d-metal" data-preset="metal-3d">🛡️ ৩ডি মেটাল</button>
                    <button class="preset-card p-holographic" data-preset="holographic">🌈 হোলোগ্রাফিক</button>
                    <button class="preset-card p-emerald" data-preset="emerald-glass">❇️ গ্লাসি এমারেল্ড</button>
                    <button class="preset-card p-purple-glow" data-preset="purple-glow">🔮 পার্পল গ্লো</button>
                    <button class="preset-card p-chrome" data-preset="chrome-mirror">🪞 ক্রোম মিরর</button>
                    <button class="preset-card p-gradient-fill" data-preset="gradient-fill">🎨 গ্র্যাডিয়েন্ট স্ট্রোক</button>
                    <button class="preset-card p-neon-sign" data-preset="neon-sign">💡 নিয়ন সাইন</button>
                    <button class="preset-card p-foil" data-preset="foil-rainbow">🌟 ফয়েল রেইনবো</button>
                    <button class="preset-card p-comic" data-preset="comic-pop">💥 কমিক পপ</button>
                    <button class="preset-card p-paper" data-preset="paper-cut">📄 পেপার কাট</button>
                    <button class="preset-card p-sunset" data-preset="sunset-gradient">🌅 সানসেট গ্র্যাডিয়েন্ট</button>
                    <button class="preset-card p-retro" data-preset="retro-vhs">📼 রেট্রো ভিএইচএস</button>
                </div>
            </aside>

            <main class="canvas-workspace">
                <div id="canvas" class="transparent-canvas ratio-1080">
                    <canvas id="export-canvas" style="display:none;"></canvas>
                </div>
            </main>

            <aside class="sidebar right-sidebar">
                <div class="section-title">PROPERTIES</div>
                <div id="properties-content">
                    <p class="empty-msg">ক্যানভাস থেকে যেকোনো টেক্সট সিলেক্ট করুন</p>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
